<!DOCTYPE html>
<html>
<head>
    <title>Create Trek</title>
</head>
<body>

<h1>Create Trek</h1>

<form method="POST">

    Trek Name:<br>
    <input type="text" name="name"><br><br>

    Location:<br>
    <input type="text" name="location"><br><br>

    Difficulty:<br>
    <select name="difficulty">
        <option>Easy</option>
        <option>Medium</option>
        <option>Hard</option>
    </select><br><br>

    Duration (Days):<br>
    <input type="number" name="duration"><br><br>

    Slots:<br>
    <input type="number" name="slots"><br><br>

    Status:<br>
    <select name="status">
        <option>Open</option>
        <option>Closed</option>
    </select><br><br>

    Start Date:<br>
    <input type="date" name="start_date"><br><br>

    End Date:<br>
    <input type="date" name="end_date"><br><br>

    <button type="submit">Create Trek</button>

</form>

</body>
</html>
