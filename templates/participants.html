<!DOCTYPE html>
<html>
<head>
    <title>Participants</title>
</head>
<body>

<h1>Participants List</h1>

<table border="1" cellpadding="10">

<tr>
    <th>Booking ID</th>
    <th>User ID</th>
    <th>Booking Status</th>
    <th>Booking Date</th>
</tr>

{% for b in bookings %}
<tr>
    <td>{{ b.id }}</td>
    <td>{{ b.user_id }}</td>
    <td>{{ b.status }}</td>
    <td>{{ b.booking_date }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
