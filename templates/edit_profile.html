<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
</head>
<body>

<h1>Edit Profile</h1>

<form method="POST">

    Name:
    <input type="text" name="name" value="{{ user.name }}">
    <br><br>

    Email:
    <input type="email" name="email" value="{{ user.email }}">
    <br><br>

    <input type="submit" value="Update Profile">

</form>

</body>
</html>
