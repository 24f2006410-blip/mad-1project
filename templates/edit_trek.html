<!DOCTYPE html>
<html>
<head>
    <title>Edit Trek</title>
</head>
<body>

<h1>Edit Trek</h1>

<form method="POST">

    Trek Name:<br>
    <input type="text" name="name" value="{{ trek.name }}"><br><br>

    Location:<br>
    <input type="text" name="location" value="{{ trek.location }}"><br><br>

    Difficulty:<br>
    <select name="difficulty">
        <option {% if trek.difficulty=="Easy" %}selected{% endif %}>Easy</option>
        <option {% if trek.difficulty=="Medium" %}selected{% endif %}>Medium</option>
        <option {% if trek.difficulty=="Hard" %}selected{% endif %}>Hard</option>
    </select><br><br>

    Duration:<br>
    <input type="number" name="duration" value="{{ trek.duration }}"><br><br>

    Slots:<br>
    <input type="number" name="slots" value="{{ trek.slots }}"><br><br>

    Status:<br>
    <select name="status">
        <option {% if trek.status=="Open" %}selected{% endif %}>Open</option>
        <option {% if trek.status=="Closed" %}selected{% endif %}>Closed</option>
    </select><br><br>

    Start Date:<br>
    <input type="date" name="start_date" value="{{ trek.start_date }}"><br><br>

    End Date:<br>
    <input type="date" name="end_date" value="{{ trek.end_date }}"><br><br>

    <button type="submit">Update Trek</button>

</form>

</body>
</html>
